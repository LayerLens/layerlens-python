# AI Quality Gate for GitHub Actions
# Runs evaluation against a golden dataset using the LayerLens Python SDK.
# Blocks PRs if pass rate drops below threshold.
#
# Prerequisites:
#   - LAYERLENS_API_KEY stored as a GitHub Actions secret
#
# Usage:
#   Copy to .github/workflows/ai-quality-gate.yml

name: AI Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "prompts/**"
      - "agents/**"

env:
  LAYERLENS_API_KEY: ${{ secrets.LAYERLENS_API_KEY }}
  PASS_RATE_THRESHOLD: "0.85"

jobs:
  evaluate:
    name: Run AI Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commits: a tag can be moved, and this job holds LAYERLENS_API_KEY.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # `layerlens` on public PyPI is an unrelated project. uv takes a package only from
      # the first index that has it, so `layerlens` comes from the LayerLens index and its
      # dependencies from PyPI. pip would take whichever index offers the higher version,
      # and this job runs with LAYERLENS_API_KEY in its environment.
      - name: Install dependencies
        run: uv pip install --system --extra-index-url https://sdk.layerlens.ai/package "layerlens>=2.0.0"
      - name: Run evaluation gate
        run: python samples/cicd/quality_gate.py --threshold $PASS_RATE_THRESHOLD
