name: Check Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python and exactly uv.lock
        uses: ./.github/actions/setup-locked-env

      - name: Check lint
        run: ./scripts/lint
