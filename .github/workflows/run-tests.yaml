name: Run Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One red version must not cancel the others: each version's result is a separate signal.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }} and exactly uv.lock
        uses: ./.github/actions/setup-locked-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run lints
        run: ./scripts/lint

      - name: Run tests
        run: ./scripts/test

  coverage:
    # Core-scoped coverage gate (LAY-3614 / W3): floor on the shared core
    # machinery only, run once on 3.11 (coverage is py-version-stable for core).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11 and exactly uv.lock
        uses: ./.github/actions/setup-locked-env
        with:
          python-version: "3.11"

      - name: Core coverage gate
        run: ./scripts/test_cov_core

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Reads [tool.uv] required-version; "lowest" installs exactly its floor.
          resolution-strategy: lowest

      - name: Build package
        run: uv build

      - name: Check build artifacts
        run: |
          ls -la dist/
          # Verify wheel and source distribution were created
          test -f dist/*.whl
          test -f dist/*.tar.gz
