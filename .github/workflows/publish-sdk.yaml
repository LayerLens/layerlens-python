# This workflow is used to publish the Python SDK to the actual PyPI.
# It is triggered by a tag push or manually, and will only publish if the tag is valid.
# The tag must match the format v*.*.*

name: Publish Python SDK

on:
  push:
    tags:
      # Final releases only — e.g. v1.2.0. Pre-release tags (v1.2.0-rc1) go to
      # the private S3 index from the private repo and must never reach PyPI.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.2.0). Must match a tag that already exists."
        required: true
        type: string

jobs:
  validate:
    # PyPI publishes only from the public repo. The same workflow file exists in
    # the private upstream, where this guard keeps it from ever reaching PyPI.
    if: github.repository == 'LayerLens/layerlens-python'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      release_tag: ${{ steps.set_release_tag.outputs.release_tag }}
      release_sha: ${{ steps.set_release_tag.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag being released, never the ref a dispatch ran from, so the
          # version and scripts validated are those of the commit that ships.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0 # Fetch all history for checking branch
      - name: Set release tag
        id: set_release_tag
        # ensure the tag is valid (matches code, is on release branch, etc)
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          else
            RELEASE_TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "Using tag: $RELEASE_TAG"
          ./scripts/validate-release-tag.sh "$RELEASE_TAG"
          # The publish job builds this exact commit, not the tag name again, which
          # could be moved after this check.
          if [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error title=Tag moved::$RELEASE_TAG no longer points at the commit checked out here"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-and-publish:
    needs: validate
    if: github.repository == 'LayerLens/layerlens-python'
    runs-on: ubuntu-latest
    environment: production

    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit validate checked, not the ref a dispatch ran from.
          ref: ${{ needs.validate.outputs.release_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: make install-build-deps
      - name: Build
        run: make build
      - name: Test wheel
        run: make test-wheel
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist/
          retention-days: 5
      - name: Publish to PyPI
        run: make _publish
        env:
          PYPI_REPO: pypi
