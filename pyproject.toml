[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/layerlens/_version.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[project]
name = "layerlens"
dynamic = ["version"]
description = "The official Python library for the LayerLens API"
license = "Apache-2.0"
authors = [{ name = "LayerLens", email = "support@layerlens.ai" }]
dependencies = ["httpx>=0.23.0, <1", "pydantic>=2.0.1, <3"]
requires-python = ">= 3.8"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
cli = ["click>=8.0.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
azure = ["openai>=1.0.0"]
# Canonical M3 name; `azure` kept as alias for prior installs.
providers-azure-openai = ["openai>=1.0.0"]
google-vertex = ["google-cloud-aiplatform>=1.38"]
# Canonical M3 name per LAY-3453 AC; `google-vertex` kept as alias for prior installs.
providers-vertex = ["google-cloud-aiplatform>=1.38"]
bedrock = ["boto3>=1.34"]
# Canonical M3 name; `bedrock` kept as alias for prior installs.
providers-bedrock = ["boto3>=1.34"]
ollama = ["ollama>=0.1"]
# Canonical M3 name per LAY-3454 AC; `ollama` kept as alias for prior installs.
providers-ollama = ["ollama>=0.1"]
langchain = ["langchain-core>=0.1.0"]
# LangGraph 0.2+ is Pydantic v2-only — see ``LangGraphCallbackHandler.requires_pydantic`` (LAY-3446).
langgraph = ["langgraph>=0.2.0", "langchain-core>=0.1.0"]
# CrewAI 0.30+ is Pydantic v2-only — see ``CrewAIAdapter.requires_pydantic`` (LAY-3447).
# Every crewai release requires Python 3.10+, so gate the extra on the interpreter
# version (matching mcp/a2a/semantic-kernel) to keep the 3.9 lockfile resolvable.
crewai = ["crewai>=0.30.0; python_version >= '3.10'"]
# AutoGen split at 0.4: the new ``autogen-agentchat`` package is the runtime layer (LAY-3448).
# autogen-agentchat 0.4+ also requires Python 3.10+, so gate it the same way.
autogen = ["autogen-agentchat>=0.4.0; python_version >= '3.10'"]
# Agentforce adapter uses Salesforce REST + Data Cloud APIs via httpx (LAY-3449).
agentforce = ["httpx>=0.27.0"]
litellm = ["litellm>=1.0.0"]
# Canonical M3 name; `litellm` kept as alias for prior installs.
providers-litellm = ["litellm>=1.0.0"]
# No upper bound: the adapter is verified on 0.8.1 through 2.x. With genai-prices >= 0.1,
# pydantic-ai 2.0-2.16 report zero tokens for responses that include a reasoning-token
# count, as OpenAI chat completions do (an upstream bug, fixed in 2.17). A fresh install
# does not resolve those: it gets 0.8.1 on Python 3.9 and 2.17 or later on 3.10+.
pydantic-ai = ["pydantic-ai>=0.8.1"]
openai-agents = ["openai-agents>=0.1.0"]
semantic-kernel = ["semantic-kernel>=1.0.0; python_version >= '3.10'"]
# mcp SDK requires Python 3.10+, so we gate the optional-dep on the interpreter
# version rather than bumping the library's overall requires-python.
mcp = ["mcp>=0.9; python_version >= '3.10'"]
a2a = ["a2a-sdk>=0.1; python_version >= '3.10'"]
agui = []
# DSPy renamed its distribution from ``dspy-ai`` to ``dspy`` at 2.6; 3.x requires
# Python 3.10+, so gate the extra to keep the 3.9 lockfile resolvable.
dspy = ["dspy>=2.6; python_version >= '3.10'"]
instructor = ["instructor>=1.3.0"]
# Marvin 3.x runs on Pydantic AI. marvin 3.2.7 declares ``pydantic-ai>=1.9.0``
# with NO upper bound, but breaks at RUNTIME from 1.95.0 (its streaming.py calls
# the pre-1.95 ModelResponsePartsManager signature) — the dependency still
# RESOLVES, so an uncapped `pip install layerlens[marvin]` yields an install that
# raises TypeError on the first primitive call. Bisected: 1.94.0 last-good,
# 1.95.0 first-broken. Cap here until marvin corrects its own metadata; this is
# deliberately NOT added to ``all-frameworks``, so the bound cannot leak onto
# users who only wanted the pydantic-ai adapter.
#
# genai-prices is capped for the same reason (LAY-4241). pydantic-ai < 1.107.7
# declares ``genai-prices>=...`` with no upper bound, but genai-prices 0.1.0 added
# ``Usage.output_reasoning_tokens`` and pydantic-ai 1.9-1.94 then raises TypeError
# extracting usage and swallows it: every run reports zero tokens. pydantic-ai
# 1.107.7 caps it ``<0.1`` itself; the pydantic-ai cap above keeps marvin installs
# below that release, so mirror its cap here. Drop both once marvin supports
# pydantic-ai >= 1.95.
marvin = [
  "marvin>=3.0; python_version >= '3.10'",
  "pydantic-ai>=1.9,<1.95; python_version >= '3.10'",
  "genai-prices<0.1; python_version >= '3.10'",
]
# Mirascope v2 relocated the call surface from ``mirascope.core.<provider>.call``
# to ``mirascope.llm.call``; the adapter targets v2, so exclude the v1 line
# rather than silently no-op against it.
mirascope = ["mirascope[openai]>=2.0,<3; python_version >= '3.10'"]
# NB: no ``browser-use`` extra. browser-use 0.13.x hard-pins openai==2.16.0,
# which is incompatible with the openai>=2.31.0 the rest of the SDK requires (the
# Responses-API path), so it cannot be a co-installable feature of this package —
# an all-features lock resolution has no solution. The adapter has no import-time
# dependency on it; install browser-use in its own environment
# (``pip install browser-use``) and instrument as usual. It is tested against a
# pinned browser-use in its isolated matrix venv, not the shared dev lock.
# Ingestion tier: no runtime dependency. The OpenInference semantic conventions
# are attribute-key strings the producer already stamped, so the importer reads
# exported spans with nothing installed. Mirrors the empty ``agui`` extra.
openinference = []
# OpenRouter is an OpenAI-compatible gateway — the openai SDK IS the client.
providers-openrouter = ["openai>=1.0.0"]
all-providers = [
  "openai>=1.0.0",
  "anthropic>=0.18.0",
  "google-cloud-aiplatform>=1.38",
  "boto3>=1.34",
  "ollama>=0.1",
  "litellm>=1.0.0",
]
all-protocols = [
  "mcp>=0.9; python_version >= '3.10'",
  "a2a-sdk>=0.1; python_version >= '3.10'",
]
all-frameworks = [
  "langchain-core>=0.1.0",
  "langgraph>=0.2.0",
  "crewai>=0.30.0; python_version >= '3.10'",
  "autogen-agentchat>=0.4.0; python_version >= '3.10'",
  "httpx>=0.27.0",
  "semantic-kernel>=1.0.0; python_version >= '3.10'",
  "pydantic-ai>=0.8.1",
  "openai-agents>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/LayerLens/stratix-python"
Repository = "https://github.com/LayerLens/stratix-python"

[project.scripts]
layerlens = "layerlens.cli:main"
stratix = "layerlens.cli:legacy_main"

# Development tooling. Versions are pinned in uv.lock together with every extra above;
# CI installs exactly that lock (see CONTRIBUTING.md > "Dependencies and the lock").
# The scripts in scripts/ (lint, format, test, ...) replace the old rye scripts.
[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pyright==1.1.399",
    "pytest-cov>=6.2.1",
    "ruff",
    "build",
    "twine==6.1.0",
    "click>=8.0.0",
    "openai>=2.31.0",
    "anthropic>=0.94.0",
    "langchain-core>=0.3.84",
    # The openinference suites build real OpenTelemetry spans (and decode OTLP
    # protobuf). The adapter itself needs neither package, so list them here: on
    # Python 3.9 they used to arrive only through pydantic-ai's mistral client.
    "opentelemetry-sdk",
    "opentelemetry-proto",
    # Floors that keep the lock on current releases (LAY-4242). One lock holds every
    # extra, so `uv lock --upgrade` trades versions between them, and without these it
    # picks semantic-kernel 1.8.0 (which breaks on pydantic >= 2.12), dspy 2.6 and
    # crewai 1.6, so the dspy-3 and crewai >= 1.14 suites would skip. They bound only
    # this environment, never what customers install. Every crewai >= 1.14 needs
    # lancedb, which ships no Intel-mac wheels, so Intel Macs keep an older crewai.
    "crewai>=1.15.28; python_version >= '3.10' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "dspy>=3.4.1; python_version >= '3.10'",
    "semantic-kernel>=1.45.0; python_version >= '3.10'",
]
# Mutation testing for the bite-check and nightly mutation workflows. Not a default
# group: install it with `uv sync --all-extras --group mutation`.
mutation = ["mutmut==2.5.1"]

[tool.uv]
# CI pins this exact uv (.github/actions/setup-locked-env); older uv may write the lock
# differently, so the floor keeps local locks consistent with CI's `uv lock --check`.
required-version = ">=0.12.23"
# The environments uv.lock is resolved for: what CI tests (CPython 3.9-3.12 on Linux
# x86_64) plus where the team develops (Linux aarch64, macOS). This bounds the dev
# lock only; it does not change requires-python or what customers can install.
# Machines are listed explicitly because uv otherwise also resolves forks such as
# Linux ppc64le, where wheel-only dependencies (onnxruntime) have nothing to install.
environments = [
    "platform_python_implementation == 'CPython' and python_version >= '3.9' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "platform_python_implementation == 'CPython' and python_version >= '3.9' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "platform_python_implementation == 'CPython' and python_version >= '3.9' and python_version < '3.13' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "platform_python_implementation == 'CPython' and python_version >= '3.9' and python_version < '3.13' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Build backends are resolved in isolated build environments, outside uv.lock. Pin
# the ones CI uses: hatchling for this project (every `uv sync` builds it editable,
# and `uv build`), setuptools for the locked sdist-only packages (mutmut, pybars4,
# pymeta3). hatchling >= 1.29 and setuptools 84 need Python 3.10+. A new sdist-only
# dependency with another backend needs its backend added here.
build-constraint-dependencies = [
    "hatchling==1.27.0; python_version < '3.10'",
    "hatchling==1.32.4; python_version >= '3.10'",
    "setuptools==82.0.1; python_version < '3.10'",
    "setuptools==84.0.0; python_version >= '3.10'",
    "packaging==25.0",
    "pathspec==0.12.1",
    "pluggy==1.6.0",
    "tomli==2.2.1",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]

[tool.ruff]
line-length = 120
output-format = "grouped"
target-version = "py37"
# Markdown stays out of ruff: from 0.17 ruff also formats the Python blocks in .md
# files, which would rewrite every code example in the docs.
exclude = ["samples", "*.md"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  # isort
  "I",
  # bugbear rules
  "B",
  # remove unused imports
  "F401",
  # bare except statements
  "E722",
  # unused arguments
  "ARG",
  # print statements
  "T201",
  "T203",
  # misuse of typing.TYPE_CHECKING
  "TC004",
  # import rules
  "TID251",
]
ignore = [
  # mutable defaults
  "B006",
]
unfixable = [
  # disable auto fix for print statements
  "T201",
  "T203",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"functools.lru_cache".msg = "This function does not retain type information for the wrapped function's arguments; The `lru_cache` function from `_utils` should be used instead"

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
known-first-party = ["openai", "tests"]

[tool.ruff.lint.per-file-ignores]
"bin/**.py" = ["T201", "T203"]
"scripts/**.py" = ["T201", "T203"]
"tests/**.py" = ["T201", "T203", "ARG", "B007"]
"examples/**.py" = ["T201", "T203"]
"samples/**.py" = ["T201", "T203", "ARG"]
"src/layerlens/cli/**" = ["T201", "T203"]
"src/layerlens/instrument/adapters/frameworks/langchain.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/langgraph.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/crewai.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/pydantic_ai.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/openai_agents.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/autogen.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/llamaindex.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/semantic_kernel.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/smolagents.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/google_adk.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/agno.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/strands.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/bedrock_agents.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/haystack.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/langfuse.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/agentforce.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/ms_agent_framework.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/embedding.py" = ["ARG002"]
"src/layerlens/instrument/adapters/frameworks/vector_store.py" = ["ARG002"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = false

# Less strict settings for adapter frameworks (optional deps not always installed), tests, and cli
executionEnvironments = [
  { root = "src/layerlens/instrument/adapters/frameworks", reportMissingImports = false, reportPossiblyUnboundVariable = false, reportOptionalMemberAccess = false, reportOptionalCall = false, reportArgumentType = false, reportAttributeAccessIssue = false, reportGeneralTypeIssues = false },
  { root = "src/layerlens/instrument/adapters/providers", reportMissingImports = false, reportAttributeAccessIssue = false },
  { root = "src/layerlens/instrument/adapters/protocols", reportMissingImports = false, reportPossiblyUnboundVariable = false, reportOptionalMemberAccess = false, reportOptionalCall = false, reportArgumentType = false, reportAttributeAccessIssue = false, reportCallIssue = false },
  { root = "src/layerlens/cli", reportMissingImports = false, reportFunctionMemberAccess = false, reportCallIssue = false, reportArgumentType = false, reportAttributeAccessIssue = false },
  { root = "tests", reportGeneralTypeIssues = false, reportOptionalSubscript = false, reportOptionalMemberAccess = false, reportUntypedFunctionDecorator = false, reportUnknownArgumentType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnnecessaryIsInstance = false, reportUnnecessaryComparison = false, reportArgumentType = false, reportCallIssue = false },
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `from tests.instrument.conftest import ...`
# resolves regardless of how pytest is invoked. Whole-suite runs and
# `python -m pytest` add the cwd implicitly, but `pytest <single-file>`
# (as pre-commit runs it) does not — without this the streaming tests fail
# to import `tests` at collection time.
pythonpath = ["."]
testpaths = ["tests"]
